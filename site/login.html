<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEasy — Login</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-bar">
      <a class="brand" href="index.html">ShopEasy</a>
      <nav class="nav-links">
        <a href="index.html" data-testid="nav-home">Home</a>
        <a href="catalog.html" data-testid="nav-catalog">Catalog</a>
        <a href="cart.html" class="cart-link" data-testid="nav-cart">Cart <span class="cart-badge" id="cart-count">0</span></a>
        <a href="dashboard.html" data-testid="nav-dashboard">My Account</a>
        <a href="playground.html" data-testid="nav-playground">Playground</a>
        <a href="login.html" id="auth-link" data-testid="nav-auth">Login</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:420px;">
    <h1 class="page-title">Log in</h1>
    <p class="page-subtitle">Demo credentials: <code>test@example.com</code> / <code>Password123</code></p>

    <div class="alert alert-error" id="login-error" data-testid="login-error">Invalid email or password.</div>

    <form id="login-form" data-testid="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" data-testid="login-email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" data-testid="login-password" required>
      </div>
      <div class="form-group">
        <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
          <input type="checkbox" id="remember" name="remember" data-testid="remember-checkbox" style="width:auto;">
          Remember me
        </label>
      </div>
      <button type="submit" id="login-btn" data-testid="login-submit">Log in</button>
    </form>

    <p style="margin-top:16px;">No account? <a href="register.html" data-testid="go-to-register">Create one</a></p>
  </main>

  <footer class="site-footer">
    <p>ShopEasy demo &mdash; static site for Selenium/Pytest training. No real backend, no real payments.</p>
  </footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
