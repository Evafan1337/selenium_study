[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: fast, high-value checks
    regression: broader coverage, run less often
    login: authentication flows
    registration: sign-up flow
    catalog: home/catalog browsing and search
    product: product detail page
    cart: shopping cart
    checkout: checkout wizard
    dashboard: authenticated account area
    playground: standalone Selenium-feature widgets

# Add `--alluredir=allure-results` on the command line (or via addopts below)
# to collect Allure results. Left out of the default addopts so the suite
# runs with plain pytest output out of the box.
addopts = -ra --strict-markers
